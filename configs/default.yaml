# Shared defaults. Tier configs override env_id, max_steps, and the output path.
env_id: PickCube-v1
obs_mode: pointcloud
control_mode: pd_ee_delta_pose
sim_backend: auto
num_envs: 1
num_workers: 1
num_episodes: 20
seed: 0
planner: srmp
source_weights:
  expert: 0.5
  noisy: 0.3
  explore: 0.2
noise_epsilon: 0.3
randomize_camera: false
camera_pos_noise: 0.02
num_points: 2048
store_rgb: false
downsample: fps
voxel_size: 0.01
table_keep: 256
workspace_min: [-0.2, -0.7, -0.05]
workspace_max: [1.0, 0.7, 0.8]
out: outputs/pickcube.zarr
format: zarr
context_frames: 3
frameskip: 5
horizon: 4
level2_stride: 10
level2_horizon: 2
probe_srmp_issues: true
verbose: false
