task_id: StackCube-v1
mode: both  # "expert_srmp", "branched_exploratory", or "both"
control_mode: pd_joint_delta_pos
action_dim: 8
arm_delta_scale: 0.1
max_episode_steps: 160
num_envs: 64
num_points: 4096

# Robot-base frame workspace crop bounds (meters)
# Expanded x-bounds ensure StackCube-v1 ([0.415, 0.815]) and PullCubeTool-v1 ([0.665, 0.865])
# target objects are never cropped out while keeping tabletop, arm, and distractors intact.
workspace_bounds:
  x: [-0.15, 1.05]
  y: [-0.55, 0.55]
  z: [-0.05, 0.65]

voxel_size: 0.0045

expert_episodes: 20
branched_episodes: 100

branch_mixture:
  noisy_expert: 0.50
  interrupted: 0.30
  random_ou: 0.20

expert_noise_sigma_range: [0.05, 0.15]
ou_theta: 0.15
ou_sigma: 0.30

output_dir: outputs/datasets
snapshots_path: null
export_ply_count: 2
seed: 42

# Storage: float16 xyz (<=0.5 mm error, loaders cast to float32) and voxel-key
# point ordering roughly halve on-disk size vs. float32 in random order.
xyz_dtype: float32  # "float32" or "float16"
sort_by_voxel: false
# Stop collecting gracefully when free disk space at output_dir drops below this.
min_free_gb: 0.0
