[project]
name = "point-hjepa"
version = "0.1.0"
description = "ManiSkill3 6D point-cloud data collection and bottom-up Point-H-JEPA world model with Utonia Tiny, SIGReg, and Hindsight 3D Goal Mapper."
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.10",
    "point-transformer-v3>=0.1.2",
    "mani_skill>=3.0",
    "srmp>=0.3.0,<0.4",
    "gymnasium",
    "zarr>=3.0",
    "numcodecs",
    "numpy>=1.26,<2",
    "scipy",
    "einops",
    "wandb",
    "hydra-core",
    "trimesh",
    "pyyaml",
    "tqdm",
    "viser",
    "imageio",
    "opencv-python",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["point_hjepa*"]
